name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run Ruff lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q greynoc_nhi tests

      - name: Run tests
        run: pytest -q

      - name: Run Bandit security scan
        # Gate on medium+ severity, matching security.yml's audit job. Low-severity
        # findings here are structural to a git-shelling secret scanner: B105 fires
        # on token-prefix detection patterns (not real credentials), and
        # B404/B603/B607 on fixed-argument git subprocess calls (never shell=True).
        run: bandit -r greynoc_nhi -q --severity-level medium

      - name: Run dependency audit
        run: pip-audit
