apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-prod-app
automountServiceAccountToken: true
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: fake-cluster-admin
subjects:
  - kind: ServiceAccount
    name: fake-prod-app
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
